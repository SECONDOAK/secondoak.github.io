    <style>
      /* ── Design tokens ─────────────────────────────────────────────── */
      :root {
        --canvas: 241 241 243;
        --panel: 255 255 255;
        --subtle: 244 244 245;
        --hover: 238 238 240;
        --line: 230 230 233;
        --line-strong: 212 212 216;
        --fg: 24 24 27;
        --fg-muted: 98 98 106;
        --fg-faint: 152 152 160;
        --accent: 229 72 77;
        --route: 47 111 235;
        --verified: 24 128 86;
        --shadow-card: 0 1px 2px rgb(0 0 0 / 0.04);
        --shadow-pop: 0 12px 32px -8px rgb(0 0 0 / 0.16), 0 0 0 1px rgb(0 0 0 / 0.05);
        --shadow-float: 0 4px 14px -2px rgb(0 0 0 / 0.14), 0 0 0 1px rgb(0 0 0 / 0.06);
        color-scheme: light;
      }
      .dark {
        --canvas: 9 9 11;
        --panel: 17 17 19;
        --subtle: 25 25 28;
        --hover: 33 33 37;
        --line: 37 37 41;
        --line-strong: 54 54 60;
        --fg: 237 237 239;
        --fg-muted: 160 160 168;
        --fg-faint: 108 108 116;
        --accent: 236 93 98;
        --route: 92 145 247;
        --verified: 74 196 140;
        --shadow-card: 0 1px 2px rgb(0 0 0 / 0.3);
        --shadow-pop: 0 16px 40px -8px rgb(0 0 0 / 0.6), 0 0 0 1px rgb(255 255 255 / 0.07);
        --shadow-float: 0 4px 16px -2px rgb(0 0 0 / 0.5), 0 0 0 1px rgb(255 255 255 / 0.08);
        color-scheme: dark;
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        background: rgb(var(--canvas));
        color: rgb(var(--fg));
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        font-feature-settings: 'ss01', 'cv11';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      ::selection { background: rgb(var(--accent) / 0.2); }
      .tnum { font-variant-numeric: tabular-nums; }

      /* Scrollbars — thin and quiet */
      * { scrollbar-width: thin; scrollbar-color: rgb(var(--line-strong)) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--line-strong));
        border-radius: 999px;
        border: 3px solid transparent;
        background-clip: content-box;
      }

      /* Focus — one consistent ring everywhere */
      :focus { outline: none; }
      :focus-visible {
        outline: 2px solid rgb(var(--fg) / 0.7);
        outline-offset: 2px;
        border-radius: 6px;
      }

      /* Search hero — a calm single-hue accent wash, opaque so cards never show through while sticky */
      .search-hero {
        background:
          linear-gradient(rgb(var(--accent) / 0.075), rgb(var(--accent) / 0.035)),
          rgb(var(--panel));
      }

      /* ── Motion ─────────────────────────────────────────────────────── */
      @keyframes k-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes k-pop { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: none; } }
      @keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes k-toast { from { opacity: 0; transform: translate(-50%, 8px) scale(0.98); } to { opacity: 1; transform: translate(-50%, 0); } }
      @keyframes k-spin { to { transform: rotate(360deg); } }
      @keyframes k-progress { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @keyframes k-shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
      .anim-enter { animation: k-enter 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .anim-pop { animation: k-pop 0.16s cubic-bezier(0.2, 0.8, 0.2, 1) both; transform-origin: top; }
      .anim-fade { animation: k-fade 0.2s ease both; }
      .anim-toast { animation: k-toast 0.24s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .spinner {
        width: 16px; height: 16px; border-radius: 999px;
        border: 2px solid rgb(var(--fg) / 0.15);
        border-top-color: rgb(var(--fg) / 0.75);
        animation: k-spin 0.7s linear infinite;
      }
      .spinner-current { border-color: currentColor; border-right-color: transparent; opacity: 0.85; }
      .progress-bar { position: absolute; inset: 0 auto 0 0; width: 40%; background: rgb(var(--accent)); animation: k-progress 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .skeleton {
        border-radius: 4px;
        background: linear-gradient(90deg, rgb(var(--subtle)) 0px, rgb(var(--hover)) 80px, rgb(var(--subtle)) 160px);
        background-size: 400px 100%;
        animation: k-shimmer 1.2s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }

      /* ── Tooltips (data-tip) ───────────────────────────────────────── */
      [data-tip] { position: relative; }
      [data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        z-index: 60;
        top: calc(100% + 6px);
        left: 50%;
        transform: translate(-50%, -2px);
        padding: 5px 8px;
        border-radius: 6px;
        background: rgb(24 24 27);
        color: rgb(250 250 250);
        font: 500 11.5px/1.2 'Geist', ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0;
        text-transform: none;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s ease, transform 0.12s ease;
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.18);
      }
      .dark [data-tip]::after { background: rgb(250 250 250); color: rgb(24 24 27); }
      [data-tip][data-tip-pos="left"]::after { top: 50%; left: auto; right: calc(100% + 8px); transform: translate(2px, -50%); }
      [data-tip][data-tip-pos="top"]::after { top: auto; bottom: calc(100% + 6px); transform: translate(-50%, 2px); }
      [data-tip][data-tip-align="end"]::after { left: auto; right: 0; transform: translateY(-2px); }
      [data-tip][data-tip-wrap]::after { white-space: normal; width: 240px; left: 0; transform: translateY(-2px); line-height: 1.45; padding: 7px 9px; }
      @media (hover: hover) {
        [data-tip][data-tip-wrap]:hover::after { transform: none; }
        [data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 0.35s; }
        [data-tip][data-tip-pos="left"]:hover::after { transform: translate(0, -50%); }
        [data-tip][data-tip-pos="top"]:hover::after { transform: translate(-50%, 0); }
        [data-tip][data-tip-align="end"]:hover::after { transform: none; }
      }

      /* ── Leaflet ────────────────────────────────────────────────────── */
      .leaflet-container {
        background: rgb(var(--subtle));
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        outline: none;
      }
      .leaflet-div-icon { background: transparent !important; border: none !important; overflow: visible !important; }
      .leaflet-control-scale { margin: 0 0 12px 12px !important; }
      .leaflet-control-scale-line {
        background: rgb(var(--panel) / 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgb(var(--fg) / 0.35);
        border-top: none;
        color: rgb(var(--fg));
        font: 500 10.5px/1.5 'Geist Mono', ui-monospace, monospace;
        padding: 1px 6px 0;
      }
      .k-marker { cursor: grab; }
      .k-marker:active { cursor: grabbing; }

      /* Pin info popup */
      .k-popup .leaflet-popup-content-wrapper {
        background: rgb(var(--panel));
        color: rgb(var(--fg));
        border-radius: 12px;
        padding: 0;
        box-shadow: var(--shadow-pop);
      }
      .k-popup .leaflet-popup-content { margin: 0; width: 272px !important; font: 13px/1.4 'Geist', ui-sans-serif, system-ui, sans-serif; }
      .k-popup .leaflet-popup-tip { background: rgb(var(--panel)); box-shadow: none; }
      .k-popup a.leaflet-popup-close-button { top: 10px; right: 8px; width: 24px; height: 24px; font: 400 18px/22px 'Geist', sans-serif; color: rgb(var(--fg-faint)); border-radius: 6px; }
      .k-popup a.leaflet-popup-close-button:hover { color: rgb(var(--fg)); background: rgb(var(--hover)); }
      .kp-head { display: flex; gap: 10px; align-items: flex-start; padding: 14px 40px 10px 14px; }
      .kp-badge { flex-shrink: 0; width: 24px; height: 24px; border-radius: 999px; background: rgb(var(--accent)); color: #fff; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
      .kp-title { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
      .kp-sub { color: rgb(var(--fg-muted)); font-size: 12.5px; }
      .kp-rows, .kp-coords { border-top: 1px solid rgb(var(--line)); padding: 6px 14px; }
      .kp-coords { background: rgb(var(--subtle)); }
      .kp-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
      .kp-k { color: rgb(var(--fg-muted)); font-size: 12px; flex-shrink: 0; }
      .kp-v { text-align: right; font-size: 12.5px; word-break: break-word; }
      .kp-mono { font-family: 'Geist Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      .kp-actions { display: flex; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid rgb(var(--line)); }
      .kp-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 32px; border-radius: 8px; font: 500 12.5px 'Geist', sans-serif; cursor: pointer; border: 1px solid rgb(var(--line)); background: rgb(var(--panel)); color: rgb(var(--fg)) !important; text-decoration: none; transition: background 0.15s; }
      .kp-btn:hover { background: rgb(var(--subtle)); }
      .kp-primary { background: rgb(var(--accent)); border-color: transparent; color: #fff !important; }
      .kp-primary:hover { background: rgb(var(--accent) / 0.9); }

      /* Map element visibility filters */
      .hide-markers .mk-pin,
      .hide-markers .mk-cross { display: none !important; }
      .hide-labels .mk-label { display: none !important; }
      .hide-route-labels .route-label-pane { display: none !important; }
      .hide-minimap .minimap-container { display: none !important; }
    </style>
